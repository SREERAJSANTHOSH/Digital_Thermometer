[build-system]
requires = ["setuptools >= 68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "digital-thermometer"
version = "1.0.0"
description = "Desktop reference model for the 8051 digital thermometer firmware"
readme = "README.md"
license = "MIT"
requires-python = ">= 3.10"
authors = [
    { name = "Sreeraj S", email = "sreeraj@example.com" },
]
keywords = ["8051", "thermometer", "LM35", "ADC0808", "embedded", "reference-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.0",
    "pytest-cov >= 4.0",
    "ruff >= 0.4",
]

[project.urls]
Homepage = "https://github.com/SREERAJSANTHOSH/Digital_Thermometer"
Repository = "https://github.com/SREERAJSANTHOSH/Digital_Thermometer"
Issues = "https://github.com/SREERAJSANTHOSH/Digital_Thermometer/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
